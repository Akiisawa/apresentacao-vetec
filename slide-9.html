<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador | ERP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="side-nav">
        <a href="index.html" class="nav-dot" data-label="Capa"></a>
        <a href="slide-2.html" class="nav-dot" data-label="A Força da Vetec"></a>
        <a href="slide-3.html" class="nav-dot" data-label="Diagnóstico"></a>
        <a href="slide-4.html" class="nav-dot" data-label="Solução"></a>
        <a href="slide-5.html" class="nav-dot" data-label="Caso de Uso"></a>
        <a href="slide-6.html" class="nav-dot" data-label="Roadmap"></a>
        <a href="slide-7.html" class="nav-dot" data-label="ROI"></a>
        <a href="slide-8.html" class="nav-dot" data-label="Investimento"></a>
        <a href="slide-9.html" class="nav-dot active" data-label="Simulador"></a>
        <a href="slide-10.html" class="nav-dot" data-label="Próximos Passos"></a>
    </nav>

    <section class="container">
        <div class="sim-header hidden">
            <span class="hero-tag" style="margin-bottom: 10px;"><i class="fa-solid fa-network-wired"></i> Simulador de Arquitetura</span>
            
            <div class="sim-toggle">
                <button id="btnChaosMode" class="sim-btn" onclick="setEcosystemMode('chaos')">
                    <span class="dot-indicator" style="background:#fff;"></span> Empresa Fragmentada
                </button>
                <button id="btnErpMode" class="sim-btn active-erp" onclick="setEcosystemMode('erp')">
                    <span class="dot-indicator" style="background:#fff;"></span> Ecossistema ERP Vetec
                </button>
            </div>
        </div>

        <div class="canvas-container hidden" onclick="toggleEcosystemMode()">
            <canvas id="ecosystemCanvas"></canvas>
            
            <div id="ecoStatusPill" class="canvas-hud">
                <span class="dot-indicator dot-success" id="ecoStatusDot"></span>
                <span id="ecoStatusText">SINCRONIA TOTAL: ERP + ENGENHARIA + PRODUÇÃO CONECTADOS</span>
            </div>
            
            <div style="position: absolute; bottom: 15px; right: 15px; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-muted); opacity: 0.6; pointer-events: none;">
                <i class="fa-solid fa-computer-mouse"></i> Clique na tela para alternar
            </div>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
